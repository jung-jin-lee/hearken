<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 해설</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a href="#main" class="skip-link">본문으로 이동</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="index.html" class="site-title" aria-label="Hearken 들음 홈">Hearken 들음</a>
      <nav class="main-nav" role="navigation" aria-label="메뉴">
        <ul>
          <li><a href="books.html">도서관</a></li>
          <li><a href="bible.html" aria-current="page">성경</a></li>
          <li><a href="devotional.html">매일묵상</a></li>
          <li><a href="about.html">안내</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" role="main">
    <div class="container">
      <article id="bible-content" aria-label="성경 해설">
        <h1 id="bible-title">로드 중...</h1>
        <p id="bible-meta" class="prose" style="color: var(--color-text-muted); margin-bottom: 0.5rem;"></p>

        <div role="note" aria-label="단축키 안내" class="shortcut-hint prose" style="margin-bottom: 1.5rem; padding: 0.75rem; background: var(--color-primary-light); border-radius: 0.375rem;">
          Space 재생과 정지, 좌우 화살표 섹션 이동
        </div>

        <div id="resume-banner" role="alert" aria-live="polite" style="display: none; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-surface, #f0f4ff); border: 2px solid var(--color-primary, #3366cc); border-radius: 0.5rem;">
          <p id="resume-info" style="margin: 0 0 0.75rem 0; font-weight: bold;"></p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button id="btn-resume" style="padding: 0.5rem 1.25rem; background: var(--color-primary, #3366cc); color: #fff; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 1rem;">이어서 듣기</button>
            <button id="btn-restart" style="padding: 0.5rem 1.25rem; background: transparent; border: 2px solid var(--color-primary, #3366cc); border-radius: 0.375rem; cursor: pointer; font-size: 1rem;">처음부터 듣기</button>
          </div>
        </div>

        <nav class="chapter-nav" aria-label="장 이동">
          <a href="#" id="prev-chapter-top" aria-label="이전 장">이전 장</a>
          <span id="chapter-indicator-top"></span>
          <a href="#" id="next-chapter-top" aria-label="다음 장">다음 장</a>
        </nav>

        <section class="content-section" aria-label="해설">
          <h2>해설</h2>
          <div id="section-commentary" class="prose"></div>
        </section>

        <section class="content-section" aria-label="핵심 주제">
          <h2>핵심 주제</h2>
          <ul id="section-themes" class="prose"></ul>
        </section>

        <section class="content-section" aria-label="묵상 질문">
          <h2>묵상 질문</h2>
          <ol id="section-questions" class="prose"></ol>
        </section>

        <section class="content-section" aria-label="기도">
          <h2>기도</h2>
          <div id="section-prayer" class="prose"></div>
        </section>

        <section class="content-section" aria-label="관련 구절">
          <h2>관련 구절</h2>
          <ul id="section-crossref" class="prose"></ul>
        </section>
      </article>

      <nav class="chapter-nav" aria-label="장 이동">
        <a href="#" id="prev-chapter" aria-label="이전 장">이전 장</a>
        <span id="chapter-indicator"></span>
        <a href="#" id="next-chapter" aria-label="다음 장">다음 장</a>
      </nav>
    </div>
  </main>

  <div class="tts-controls" role="region" aria-label="음성 재생">
    <button id="btn-prev" aria-label="이전 섹션">&#9198;</button>
    <button id="btn-play" aria-label="재생">&#9654;</button>
    <button id="btn-stop" aria-label="정지">&#9632;</button>
    <button id="btn-next" aria-label="다음 섹션">&#9197;</button>
    <select id="voice-select" aria-label="음성 선택">
      <option value="">보이스 로드 중...</option>
    </select>
    <select id="speed-select" aria-label="읽기 속도">
      <option value="0.5">0.5배</option>
      <option value="0.75">0.75배</option>
      <option value="1" selected>1배</option>
      <option value="1.25">1.25배</option>
      <option value="1.5">1.5배</option>
      <option value="2">2배</option>
    </select>
    <div id="tts-status" class="tts-status" role="status" aria-live="polite">준비됨</div>
  </div>

  <script src="js/tts-controller.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var book = params.get('book') || 'genesis';
    var ch = parseInt(params.get('ch') || '1', 10);

    var BIBLE_META = {
      'genesis': { kr: '창세기', chapters: 50 },
      'exodus': { kr: '출애굽기', chapters: 40 },
      'leviticus': { kr: '레위기', chapters: 27 },
      'numbers': { kr: '민수기', chapters: 36 },
      'deuteronomy': { kr: '신명기', chapters: 34 },
      'joshua': { kr: '여호수아', chapters: 24 },
      'judges': { kr: '사사기', chapters: 21 },
      'ruth': { kr: '룻기', chapters: 4 },
      '1samuel': { kr: '사무엘상', chapters: 31 },
      '2samuel': { kr: '사무엘하', chapters: 24 },
      '1kings': { kr: '열왕기상', chapters: 22 },
      '2kings': { kr: '열왕기하', chapters: 25 },
      '1chronicles': { kr: '역대상', chapters: 29 },
      '2chronicles': { kr: '역대하', chapters: 36 },
      'ezra': { kr: '에스라', chapters: 10 },
      'nehemiah': { kr: '느헤미야', chapters: 13 },
      'esther': { kr: '에스더', chapters: 10 },
      'job': { kr: '욥기', chapters: 42 },
      'psalms': { kr: '시편', chapters: 150 },
      'proverbs': { kr: '잠언', chapters: 31 },
      'ecclesiastes': { kr: '전도서', chapters: 12 },
      'songofsolomon': { kr: '아가', chapters: 8 },
      'isaiah': { kr: '이사야', chapters: 66 },
      'jeremiah': { kr: '예레미야', chapters: 52 },
      'lamentations': { kr: '예레미야애가', chapters: 5 },
      'ezekiel': { kr: '에스겔', chapters: 48 },
      'daniel': { kr: '다니엘', chapters: 12 },
      'hosea': { kr: '호세아', chapters: 14 },
      'joel': { kr: '요엘', chapters: 3 },
      'amos': { kr: '아모스', chapters: 9 },
      'obadiah': { kr: '오바댜', chapters: 1 },
      'jonah': { kr: '요나', chapters: 4 },
      'micah': { kr: '미가', chapters: 7 },
      'nahum': { kr: '나훔', chapters: 3 },
      'habakkuk': { kr: '하박국', chapters: 3 },
      'zephaniah': { kr: '스바냐', chapters: 3 },
      'haggai': { kr: '학개', chapters: 2 },
      'zechariah': { kr: '스가랴', chapters: 14 },
      'malachi': { kr: '말라기', chapters: 4 },
      'matthew': { kr: '마태복음', chapters: 28 },
      'mark': { kr: '마가복음', chapters: 16 },
      'luke': { kr: '누가복음', chapters: 24 },
      'john': { kr: '요한복음', chapters: 21 },
      'acts': { kr: '사도행전', chapters: 28 },
      'romans': { kr: '로마서', chapters: 16 },
      '1corinthians': { kr: '고린도전서', chapters: 16 },
      '2corinthians': { kr: '고린도후서', chapters: 13 },
      'galatians': { kr: '갈라디아서', chapters: 6 },
      'ephesians': { kr: '에베소서', chapters: 6 },
      'philippians': { kr: '빌립보서', chapters: 4 },
      'colossians': { kr: '골로새서', chapters: 4 },
      '1thessalonians': { kr: '데살로니가전서', chapters: 5 },
      '2thessalonians': { kr: '데살로니가후서', chapters: 3 },
      '1timothy': { kr: '디모데전서', chapters: 6 },
      '2timothy': { kr: '디모데후서', chapters: 4 },
      'titus': { kr: '디도서', chapters: 3 },
      'philemon': { kr: '빌레몬서', chapters: 1 },
      'hebrews': { kr: '히브리서', chapters: 13 },
      'james': { kr: '야고보서', chapters: 5 },
      '1peter': { kr: '베드로전서', chapters: 5 },
      '2peter': { kr: '베드로후서', chapters: 3 },
      '1john': { kr: '요한1서', chapters: 5 },
      '2john': { kr: '요한2서', chapters: 1 },
      '3john': { kr: '요한3서', chapters: 1 },
      'jude': { kr: '유다서', chapters: 1 },
      'revelation': { kr: '요한계시록', chapters: 22 }
    };

    var meta = BIBLE_META[book] || { kr: book, chapters: 1 };

    async function loadChapter() {
      var url = 'content/bible/commentary/' + book + '/' + ch + '.json';

      try {
        var resp = await fetch(url);
        if (!resp.ok) throw new Error('파일 없음');
        var data = await resp.json();

        var titleEl = document.getElementById('bible-title');
        titleEl.textContent = meta.kr + ' ' + ch + '장';
        document.title = titleEl.textContent + ' - 성경 해설';

        document.getElementById('bible-meta').textContent =
          ch + '장 / ' + meta.chapters + '장';

        document.getElementById('section-commentary').textContent =
          data.commentary || '';

        var themesEl = document.getElementById('section-themes');
        themesEl.textContent = '';
        (data.key_themes || []).forEach(function(theme) {
          var li = document.createElement('li');
          li.textContent = theme;
          themesEl.appendChild(li);
        });

        var questionsEl = document.getElementById('section-questions');
        questionsEl.textContent = '';
        (data.questions || []).forEach(function(q) {
          var li = document.createElement('li');
          li.textContent = q;
          questionsEl.appendChild(li);
        });

        document.getElementById('section-prayer').textContent =
          data.prayer || '';

        var crossrefEl = document.getElementById('section-crossref');
        crossrefEl.textContent = '';
        (data.cross_references || []).forEach(function(ref) {
          var li = document.createElement('li');
          li.textContent = ref;
          crossrefEl.appendChild(li);
        });

        setupTTS(data);
      } catch (e) {
        document.getElementById('bible-title').textContent = '콘텐츠를 불러올 수 없습니다';
        document.getElementById('section-commentary').textContent = e.message;
      }

      setupChapterNav();
    }

    function setupChapterNav() {
      var navPairs = [
        { prev: 'prev-chapter-top', next: 'next-chapter-top', ind: 'chapter-indicator-top' },
        { prev: 'prev-chapter', next: 'next-chapter', ind: 'chapter-indicator' },
      ];

      navPairs.forEach(function(pair) {
        var prevLink = document.getElementById(pair.prev);
        var nextLink = document.getElementById(pair.next);
        var indicator = document.getElementById(pair.ind);
        if (!prevLink || !nextLink || !indicator) return;

        indicator.textContent = ch + ' / ' + meta.chapters;

        if (ch > 1) {
          prevLink.href = 'bible-read.html?book=' + book + '&ch=' + (ch - 1);
        } else {
          prevLink.style.visibility = 'hidden';
        }

        if (ch < meta.chapters) {
          nextLink.href = 'bible-read.html?book=' + book + '&ch=' + (ch + 1);
        } else {
          nextLink.style.visibility = 'hidden';
        }
      });
    }

    function setupTTS(data) {
      var tts = new TTSController();
      var progressKey = 'tts-progress:bible:' + book + ':' + ch;
      tts.setProgressKey(progressKey);

      var sections = [];

      if (data.commentary) {
        sections.push({ label: '해설', text: data.commentary });
      }
      if (data.key_themes && data.key_themes.length > 0) {
        sections.push({ label: '핵심 주제', text: data.key_themes.join('. ') });
      }
      if (data.questions && data.questions.length > 0) {
        sections.push({ label: '묵상 질문', text: data.questions.join('. ') });
      }
      if (data.prayer) {
        sections.push({ label: '기도', text: data.prayer });
      }

      tts.setSections(sections);

      var saved = TTSController.getSavedProgress(progressKey);
      if (saved && saved.sectionIndex < sections.length &&
          (saved.sectionIndex > 0 || saved.chunkIndex > 0)) {
        var banner = document.getElementById('resume-banner');
        var info = document.getElementById('resume-info');
        var elapsed = Date.now() - saved.timestamp;
        var agoText = elapsed < 3600000
          ? Math.round(elapsed / 60000) + '분 전'
          : elapsed < 86400000
            ? Math.round(elapsed / 3600000) + '시간 전'
            : Math.round(elapsed / 86400000) + '일 전';
        info.textContent = agoText + ' "' + saved.sectionLabel + '" 섹션을 듣고 있었습니다.';
        banner.style.display = 'block';

        if (saved.rate) {
          tts.setRate(saved.rate);
          document.getElementById('speed-select').value = String(saved.rate);
        }

        document.getElementById('btn-resume').addEventListener('click', function() {
          banner.style.display = 'none';
          tts.playFrom(saved.sectionIndex, saved.chunkIndex);
        });

        document.getElementById('btn-restart').addEventListener('click', function() {
          banner.style.display = 'none';
          tts.clearProgress();
        });
      }

      window.addEventListener('beforeunload', function() {
        if (tts.isPlaying || tts.isPaused) tts.saveProgress();
      });
      document.addEventListener('visibilitychange', function() {
        if (document.hidden && (tts.isPlaying || tts.isPaused)) tts.saveProgress();
      });

      var voiceSelect = document.getElementById('voice-select');
      function populateVoices() {
        var allVoices = tts.getVoices();
        var filtered = allVoices.filter(function(v) {
          var name = v.name.toLowerCase();
          return name.indexOf('yuna') !== -1 || name.indexOf('google') !== -1;
        });
        voiceSelect.textContent = '';

        if (filtered.length > 0) {
          filtered.forEach(function(v) {
            var opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.textContent = v.name;
            if (tts.voice && tts.voice.voiceURI === v.voiceURI) opt.selected = true;
            voiceSelect.appendChild(opt);
          });
        } else {
          var koreanVoices = tts.getVoices('ko');
          if (koreanVoices.length > 0) {
            koreanVoices.forEach(function(v) {
              var opt = document.createElement('option');
              opt.value = v.voiceURI;
              opt.textContent = v.name;
              if (tts.voice && tts.voice.voiceURI === v.voiceURI) opt.selected = true;
              voiceSelect.appendChild(opt);
            });
          } else {
            var fallback = document.createElement('option');
            fallback.value = '';
            fallback.textContent = '사용 가능한 보이스 없음';
            voiceSelect.appendChild(fallback);
          }
        }
      }
      tts.onVoicesReady(populateVoices);

      voiceSelect.addEventListener('change', function(e) {
        if (e.target.value) tts.setVoice(e.target.value);
      });

      var statusEl = document.getElementById('tts-status');
      var playBtn = document.getElementById('btn-play');

      tts.onStatusChange(function(msg) {
        statusEl.textContent = msg;
        if (tts.isPlaying && !tts.isPaused) {
          playBtn.textContent = '\u23F8';
          playBtn.setAttribute('aria-label', '일시정지');
        } else {
          playBtn.textContent = '\u25B6';
          playBtn.setAttribute('aria-label', '재생');
        }
      });

      document.getElementById('btn-play').addEventListener('click', function() { tts.togglePlayPause(); });
      document.getElementById('btn-stop').addEventListener('click', function() { tts.stop(); });
      document.getElementById('btn-prev').addEventListener('click', function() { tts.prevSection(); });
      document.getElementById('btn-next').addEventListener('click', function() { tts.nextSection(); });
      document.getElementById('speed-select').addEventListener('change', function(e) {
        tts.setRate(parseFloat(e.target.value));
      });

      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.code === 'Space') { e.preventDefault(); tts.togglePlayPause(); }
        else if (e.code === 'ArrowLeft') { tts.prevSection(); }
        else if (e.code === 'ArrowRight') { tts.nextSection(); }
      });
    }

    loadChapter();
  </script>
</body>
</html>

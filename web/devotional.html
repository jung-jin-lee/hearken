<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매일묵상</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a href="#main" class="skip-link">본문으로 이동</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="index.html" class="site-title" aria-label="Hearken 들음 홈">Hearken 들음</a>
      <nav class="main-nav" role="navigation" aria-label="메뉴">
        <ul>
          <li><a href="books.html">도서관</a></li>
          <li><a href="bible.html">성경</a></li>
          <li><a href="devotional.html" aria-current="page">매일묵상</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" role="main">
    <div class="container">
      <article id="devotional-content" aria-label="매일묵상">
        <h1 id="devotional-title">로드 중...</h1>
        <p id="devotional-date" class="prose" style="color: var(--color-text-muted); margin-bottom: 0.5rem;"></p>

        <div role="note" aria-label="단축키 안내" class="shortcut-hint prose" style="margin-bottom: 1.5rem; padding: 0.75rem; background: var(--color-primary-light); border-radius: 0.375rem;">
          Space 재생과 정지, 좌우 화살표 섹션 이동
        </div>

        <div id="resume-banner" role="alert" aria-live="polite" style="display: none; margin-bottom: 1.5rem; padding: 1rem; background: var(--color-surface, #f0f4ff); border: 2px solid var(--color-primary, #3366cc); border-radius: 0.5rem;">
          <p id="resume-info" style="margin: 0 0 0.75rem 0; font-weight: bold;"></p>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button id="btn-resume" style="padding: 0.5rem 1.25rem; background: var(--color-primary, #3366cc); color: #fff; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 1rem;">이어서 듣기</button>
            <button id="btn-restart" style="padding: 0.5rem 1.25rem; background: transparent; border: 2px solid var(--color-primary, #3366cc); border-radius: 0.375rem; cursor: pointer; font-size: 1rem;">처음부터 듣기</button>
          </div>
        </div>

        <nav class="chapter-nav" aria-label="날짜 이동">
          <a href="#" id="prev-day" aria-label="이전 날">이전 날</a>
          <span id="date-indicator"></span>
          <a href="#" id="next-day" aria-label="다음 날">다음 날</a>
        </nav>

        <section class="content-section" aria-label="묵상">
          <h2>오늘의 묵상</h2>
          <div id="section-reading" class="prose"></div>
        </section>

        <section class="content-section" aria-label="질문">
          <h2>묵상 질문</h2>
          <div id="section-question" class="prose"></div>
        </section>

        <section class="content-section" aria-label="기도">
          <h2>기도</h2>
          <div id="section-prayer" class="prose"></div>
        </section>
      </article>

      <nav class="chapter-nav" aria-label="날짜 이동">
        <a href="#" id="prev-day-bottom" aria-label="이전 날">이전 날</a>
        <span id="date-indicator-bottom"></span>
        <a href="#" id="next-day-bottom" aria-label="다음 날">다음 날</a>
      </nav>
    </div>
  </main>

  <div class="tts-controls" role="region" aria-label="음성 재생">
    <button id="btn-prev" aria-label="이전 섹션">&#9198;</button>
    <button id="btn-play" aria-label="재생">&#9654;</button>
    <button id="btn-stop" aria-label="정지">&#9632;</button>
    <button id="btn-next" aria-label="다음 섹션">&#9197;</button>
    <select id="voice-select" aria-label="음성 선택">
      <option value="">보이스 로드 중...</option>
    </select>
    <select id="speed-select" aria-label="읽기 속도">
      <option value="0.5">0.5배</option>
      <option value="0.75">0.75배</option>
      <option value="1" selected>1배</option>
      <option value="1.25">1.25배</option>
      <option value="1.5">1.5배</option>
      <option value="2">2배</option>
    </select>
    <div id="tts-status" class="tts-status" role="status" aria-live="polite">준비됨</div>
  </div>

  <script src="js/tts-controller.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var now = new Date();
    var month = parseInt(params.get('m') || String(now.getMonth() + 1), 10);
    var day = parseInt(params.get('d') || String(now.getDate()), 10);

    var DAYS_IN_MONTH = [0, 31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    var MONTH_NAMES = ['', '1월', '2월', '3월', '4월', '5월', '6월',
                       '7월', '8월', '9월', '10월', '11월', '12월'];

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function getPrevDay(m, d) {
      if (d > 1) return { m: m, d: d - 1 };
      var pm = m > 1 ? m - 1 : 12;
      return { m: pm, d: DAYS_IN_MONTH[pm] };
    }

    function getNextDay(m, d) {
      if (d < DAYS_IN_MONTH[m]) return { m: m, d: d + 1 };
      var nm = m < 12 ? m + 1 : 1;
      return { m: nm, d: 1 };
    }

    async function loadDevotional() {
      var url = 'content/devotional/' + pad(month) + '/' + pad(day) + '.json';

      try {
        var resp = await fetch(url);
        if (!resp.ok) throw new Error('파일 없음');
        var data = await resp.json();

        var titleEl = document.getElementById('devotional-title');
        titleEl.textContent = data.title || (MONTH_NAMES[month] + ' ' + day + '일');
        document.title = titleEl.textContent + ' - 매일묵상';

        document.getElementById('devotional-date').textContent =
          MONTH_NAMES[month] + ' ' + day + '일';

        document.getElementById('section-reading').textContent =
          data.reading || '';

        document.getElementById('section-question').textContent =
          data.question || '';

        document.getElementById('section-prayer').textContent =
          data.prayer || '';

        setupTTS(data);
      } catch (e) {
        document.getElementById('devotional-title').textContent = '콘텐츠를 불러올 수 없습니다';
        document.getElementById('section-reading').textContent = e.message;
      }

      setupDateNav();
    }

    function setupDateNav() {
      var prev = getPrevDay(month, day);
      var next = getNextDay(month, day);

      var navPairs = [
        { prev: 'prev-day', next: 'next-day', ind: 'date-indicator' },
        { prev: 'prev-day-bottom', next: 'next-day-bottom', ind: 'date-indicator-bottom' },
      ];

      navPairs.forEach(function(pair) {
        var prevLink = document.getElementById(pair.prev);
        var nextLink = document.getElementById(pair.next);
        var indicator = document.getElementById(pair.ind);
        if (!prevLink || !nextLink || !indicator) return;

        indicator.textContent = MONTH_NAMES[month] + ' ' + day + '일';
        prevLink.href = 'devotional.html?m=' + prev.m + '&d=' + prev.d;
        nextLink.href = 'devotional.html?m=' + next.m + '&d=' + next.d;
      });
    }

    function setupTTS(data) {
      var tts = new TTSController();
      var progressKey = 'tts-progress:devotional:' + month + ':' + day;
      tts.setProgressKey(progressKey);

      var sections = [];

      if (data.reading) {
        sections.push({ label: '오늘의 묵상', text: data.reading });
      }
      if (data.question) {
        sections.push({ label: '묵상 질문', text: data.question });
      }
      if (data.prayer) {
        sections.push({ label: '기도', text: data.prayer });
      }

      tts.setSections(sections);

      var saved = TTSController.getSavedProgress(progressKey);
      if (saved && saved.sectionIndex < sections.length &&
          (saved.sectionIndex > 0 || saved.chunkIndex > 0)) {
        var banner = document.getElementById('resume-banner');
        var info = document.getElementById('resume-info');
        var elapsed = Date.now() - saved.timestamp;
        var agoText = elapsed < 3600000
          ? Math.round(elapsed / 60000) + '분 전'
          : elapsed < 86400000
            ? Math.round(elapsed / 3600000) + '시간 전'
            : Math.round(elapsed / 86400000) + '일 전';
        info.textContent = agoText + ' "' + saved.sectionLabel + '" 섹션을 듣고 있었습니다.';
        banner.style.display = 'block';

        if (saved.rate) {
          tts.setRate(saved.rate);
          document.getElementById('speed-select').value = String(saved.rate);
        }

        document.getElementById('btn-resume').addEventListener('click', function() {
          banner.style.display = 'none';
          tts.playFrom(saved.sectionIndex, saved.chunkIndex);
        });

        document.getElementById('btn-restart').addEventListener('click', function() {
          banner.style.display = 'none';
          tts.clearProgress();
        });
      }

      window.addEventListener('beforeunload', function() {
        if (tts.isPlaying || tts.isPaused) tts.saveProgress();
      });
      document.addEventListener('visibilitychange', function() {
        if (document.hidden && (tts.isPlaying || tts.isPaused)) tts.saveProgress();
      });

      var voiceSelect = document.getElementById('voice-select');
      function populateVoices() {
        var allVoices = tts.getVoices();
        var filtered = allVoices.filter(function(v) {
          var name = v.name.toLowerCase();
          return name.indexOf('yuna') !== -1 || name.indexOf('google') !== -1;
        });
        voiceSelect.textContent = '';

        if (filtered.length > 0) {
          filtered.forEach(function(v) {
            var opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.textContent = v.name;
            if (tts.voice && tts.voice.voiceURI === v.voiceURI) opt.selected = true;
            voiceSelect.appendChild(opt);
          });
        } else {
          var koreanVoices = tts.getVoices('ko');
          if (koreanVoices.length > 0) {
            koreanVoices.forEach(function(v) {
              var opt = document.createElement('option');
              opt.value = v.voiceURI;
              opt.textContent = v.name;
              if (tts.voice && tts.voice.voiceURI === v.voiceURI) opt.selected = true;
              voiceSelect.appendChild(opt);
            });
          } else {
            var fallback = document.createElement('option');
            fallback.value = '';
            fallback.textContent = '사용 가능한 보이스 없음';
            voiceSelect.appendChild(fallback);
          }
        }
      }
      tts.onVoicesReady(populateVoices);

      voiceSelect.addEventListener('change', function(e) {
        if (e.target.value) tts.setVoice(e.target.value);
      });

      var statusEl = document.getElementById('tts-status');
      var playBtn = document.getElementById('btn-play');

      tts.onStatusChange(function(msg) {
        statusEl.textContent = msg;
        if (tts.isPlaying && !tts.isPaused) {
          playBtn.textContent = '\u23F8';
          playBtn.setAttribute('aria-label', '일시정지');
        } else {
          playBtn.textContent = '\u25B6';
          playBtn.setAttribute('aria-label', '재생');
        }
      });

      document.getElementById('btn-play').addEventListener('click', function() { tts.togglePlayPause(); });
      document.getElementById('btn-stop').addEventListener('click', function() { tts.stop(); });
      document.getElementById('btn-prev').addEventListener('click', function() { tts.prevSection(); });
      document.getElementById('btn-next').addEventListener('click', function() { tts.nextSection(); });
      document.getElementById('speed-select').addEventListener('change', function(e) {
        tts.setRate(parseFloat(e.target.value));
      });

      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.code === 'Space') { e.preventDefault(); tts.togglePlayPause(); }
        else if (e.code === 'ArrowLeft') { tts.prevSection(); }
        else if (e.code === 'ArrowRight') { tts.nextSection(); }
      });
    }

    loadDevotional();
  </script>
</body>
</html>
